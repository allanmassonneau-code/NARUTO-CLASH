name: VPS setup (one-time)

# Actions -> "VPS setup (one-time)" -> Run workflow.
# Needs secrets: VPS_HOST, VPS_SSH_KEY (deploy key, private) and root access:
# VPS_ROOT_PASSWORD (or VPS_ROOT_KEY), optional VPS_ROOT_USER (default root).
on:
  workflow_dispatch:
    inputs:
      wipe:
        description: "Delete everything previously installed on the VPS (Grandlinetactics...)"
        type: boolean
        default: false
      confirm:
        description: "Type WIPE to confirm the wipe"
        type: string
        default: ""
      https_domain:
        description: "Only set up HTTPS for this domain (leave empty for a full setup)"
        type: string
        default: ""
      protect:
        description: "Only password-protect the site (secrets SITE_USER / SITE_PASSWORD)"
        type: boolean
        default: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST: ${{ secrets.VPS_HOST }}
      ROOT_USER: ${{ secrets.VPS_ROOT_USER || 'root' }}
      ROOT_PASSWORD: ${{ secrets.VPS_ROOT_PASSWORD }}
      ROOT_KEY: ${{ secrets.VPS_ROOT_KEY }}
      DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
      WIPE: ${{ inputs.wipe }}
      CONFIRM: ${{ inputs.confirm }}
      HTTPS_DOMAIN: ${{ inputs.https_domain }}
      PROTECT: ${{ inputs.protect }}
      SITE_USER: ${{ secrets.SITE_USER }}
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check inputs
        run: |
          [ -n "$HOST" ] || { echo "Secret VPS_HOST missing"; exit 1; }
          [ -n "$DEPLOY_KEY" ] || { echo "Secret VPS_SSH_KEY missing"; exit 1; }
          [ -n "$ROOT_PASSWORD$ROOT_KEY" ] || { echo "Secret VPS_ROOT_PASSWORD or VPS_ROOT_KEY missing"; exit 1; }
          if [ "$WIPE" = "true" ] && [ "$CONFIRM" != "WIPE" ]; then echo "Wipe requested but confirm is not WIPE"; exit 1; fi

      - name: Prepare SSH
        run: |
          sudo apt-get install -y sshpass >/dev/null
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keygen -y -f ~/.ssh/deploy > deploy.pub
          if [ -n "$ROOT_KEY" ]; then printf '%s\n' "$ROOT_KEY" | tr -d '\r' > ~/.ssh/root && chmod 600 ~/.ssh/root; fi

      - name: Run vps_setup.sh on the VPS
        run: |
          OPTS="-o StrictHostKeyChecking=accept-new"
          # Root key first, root password as fallback.
          if [ -n "$ROOT_KEY" ]; then
            SSH="ssh $OPTS -i $HOME/.ssh/root"; SCP="scp $OPTS -i $HOME/.ssh/root"
          else
            export SSHPASS="$ROOT_PASSWORD"
            OPTS="$OPTS -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no"
            SSH="sshpass -e ssh $OPTS"; SCP="sshpass -e scp $OPTS"
          fi
          SUDO=""; [ "$ROOT_USER" = "root" ] || SUDO="sudo"
          SUDO_E=""; [ "$ROOT_USER" = "root" ] || SUDO_E="sudo -E"
          # Stop leftovers of a previous (looping) run before starting again.
          $SSH "$ROOT_USER@$HOST" "$SUDO pkill -f vps_setu[p].sh; $SUDO pkill -x apt-get; sleep 2; $SUDO rm -f /var/cache/apt/*.bin; true"
          $SCP deploy/vps_setup.sh deploy.pub "$ROOT_USER@$HOST:/tmp/"
          FLAGS='--deploy-key "$(cat /tmp/deploy.pub)"'
          if [ "$PROTECT" = "true" ]; then
            [ -n "$SITE_USER" ] && [ -n "$SITE_PASSWORD" ] || { echo "Secrets SITE_USER / SITE_PASSWORD missing"; exit 1; }
            # Password goes through stdin, not the command line.
            printf '%s' "$SITE_PASSWORD" | $SSH "$ROOT_USER@$HOST" "read -r SITE_PASSWORD; export SITE_PASSWORD; $SUDO_E bash /tmp/vps_setup.sh --auth '$SITE_USER'"
          elif [ -n "$HTTPS_DOMAIN" ]; then
            $SSH "$ROOT_USER@$HOST" "$SUDO bash /tmp/vps_setup.sh --https '$HTTPS_DOMAIN'"
          elif [ "$WIPE" = "true" ]; then
            $SSH "$ROOT_USER@$HOST" "echo WIPE | $SUDO bash /tmp/vps_setup.sh --wipe $FLAGS"
          else
            $SSH "$ROOT_USER@$HOST" "$SUDO bash /tmp/vps_setup.sh $FLAGS"
          fi

      - name: Check web server
        run: |
          if [ "$PROTECT" = "true" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://$HOST/naruto-clash/version.json")
            [ "$code" = "401" ] && echo "Site is password-protected" || { echo "Expected 401, got $code"; exit 1; }
            exit 0
          fi
          curl -fsS "http://$HOST/" >/dev/null && echo "VPS ready"
          if [ -n "$HTTPS_DOMAIN" ]; then curl -fsSI "https://$HTTPS_DOMAIN/" && echo "HTTPS ready"; fi
