name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.3-stable
  GODOT: /home/runner/godot/godot

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAN_DEPLOY: ${{ secrets.VPS_HOST != '' && secrets.VPS_SSH_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + Windows templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/godot
            /home/runner/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-win-templates

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/godot
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64 "$GODOT"
          curl -fsSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          T=/home/runner/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
          mkdir -p "$T"
          unzip -o -j /tmp/templates.tpz templates/windows_release_x86_64.exe templates/version.txt -d "$T"

      - name: Tests (unit + full bot match)
        run: |
          "$GODOT" --headless --path . --import >/dev/null 2>&1 || true
          "$GODOT" --headless --fixed-fps 60 --path . res://tests/smoke_test.tscn 2>&1 | tee test.log
          grep -q "RESULT: PASS" test.log

      - name: Windows icon tooling (wine + rcedit)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq wine64 >/dev/null
          curl -fsSL -o /home/runner/rcedit-x64.exe https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
          python3 - <<'PY'
          import glob, os, re
          files = glob.glob(os.path.expanduser("~/.config/godot/editor_settings-4*.tres"))
          path = files[0] if files else os.path.expanduser("~/.config/godot/editor_settings-4.3.tres")
          os.makedirs(os.path.dirname(path), exist_ok=True)
          text = open(path).read() if os.path.exists(path) else '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
          for key, value in (("export/windows/rcedit", "/home/runner/rcedit-x64.exe"), ("export/windows/wine", "/usr/bin/wine")):
              line = f'{key} = "{value}"'
              text = re.sub(rf"^{re.escape(key)} = .*$", line, text, flags=re.M) if re.search(rf"^{re.escape(key)} =", text, re.M) else text.rstrip() + "\n" + line + "\n"
          open(path, "w").write(text)
          print("configured", path)
          PY

      - name: Build Windows release
        env:
          PUBLIC_HOST: ${{ secrets.VPS_HOST }}
          CHANGELOG: ${{ github.event.head_commit.message }}
        run: |
          VERSION="0.3.${{ github.run_number }}"
          export WINEDEBUG=-all
          deploy/build_release.sh "$VERSION" "${PUBLIC_HOST:-localhost}" "${CHANGELOG:-Version $VERSION}"

      - uses: actions/upload-artifact@v4
        with:
          name: naruto-clash-windows
          path: build/publish/

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        if: env.CAN_DEPLOY == 'true'
        run: |
          eval "$(ssh-agent -s)"
          echo "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -
          deploy/deploy.sh "$VPS_HOST" "${VPS_USER:-deploy}"
