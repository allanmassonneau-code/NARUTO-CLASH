name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.3-stable
  GODOT: /home/runner/godot/godot

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAN_DEPLOY: ${{ secrets.VPS_HOST != '' && secrets.VPS_SSH_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + Windows templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/godot
            /home/runner/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-win-templates

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/godot
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64 "$GODOT"
          curl -fsSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          T=/home/runner/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
          mkdir -p "$T"
          unzip -o -j /tmp/templates.tpz templates/windows_release_x86_64.exe templates/version.txt -d "$T"

      - name: Tests (unit + full bot match)
        run: |
          "$GODOT" --headless --path . --import >/dev/null 2>&1 || true
          "$GODOT" --headless --fixed-fps 60 --path . res://tests/smoke_test.tscn 2>&1 | tee test.log
          grep -q "RESULT: PASS" test.log

      - name: Build Windows release
        env:
          PUBLIC_HOST: ${{ secrets.VPS_HOST }}
          CHANGELOG: ${{ github.event.head_commit.message }}
        run: |
          VERSION="0.3.${{ github.run_number }}"
          deploy/build_release.sh "$VERSION" "${PUBLIC_HOST:-localhost}" "${CHANGELOG:-Version $VERSION}"

      - uses: actions/upload-artifact@v4
        with:
          name: naruto-clash-windows
          path: build/publish/

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        if: env.CAN_DEPLOY == 'true'
        run: |
          eval "$(ssh-agent -s)"
          echo "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -
          deploy/deploy.sh "$VPS_HOST" "${VPS_USER:-deploy}"
